name: Build and Push Docker Image

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve app version
        id: version
        run: |
          base=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' server/server.csproj | head -n 1)
          major_minor=$(printf '%s' "$base" | cut -d. -f1,2)
          echo "number=${major_minor}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            marcus360/train_dispatcher_game:latest
            marcus360/train_dispatcher_game:${{ steps.version.outputs.number }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max