<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Train Simulator</title>
      <!-- Bootstrap CSS loaded via TypeScript entry -->
      <!-- Bootstrap Icons -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
      <!-- Bootstrap JS fallback -->
      <script
         src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
         integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
         crossorigin="anonymous"></script>
   </head>
   <body class="">
      <div class="container-fluid position-relative">
         <canvas id="mainCanvas" class="w-100 h-100"></canvas>
      </div>
      <div
         class="modal fade"
         id="stationSelectModal"
         tabindex="-1"
         aria-labelledby="stationSelectModalLabel"
         aria-hidden="true"
         data-bs-backdrop="static"
         data-bs-keyboard="false">
         <div class="modal-dialog modal-dialog-centered station-select-modal-dialog">
            <div class="modal-content">
               <div class="modal-body">
                  <div class="station-select-body">
                     <div class="station-select-main">
                        <h5 id="stationSelectModalLabel" class="station-network-title">Wähle deinen Bahnhof</h5>
                        <div id="stationNetworkPlan" class="station-network-plan"></div>
                        <div class="station-preview-panel">
                           <div id="stationPreviewCard" class="station-preview-card">
                              <div id="stationPreviewStatus" class="station-preview-status">Vorschau bereit zum Laden</div>
                           </div>
                           <div class="station-preview-meta">
                              <p class="station-preview-label">Ausgewählte Station</p>
                              <h5 id="stationPreviewName"></h5>
                              <p id="stationPreviewDescription" class="mb-0"></p>
                           </div>
                           <button type="button" class="btn btn-success btn-lg" id="startButton" disabled>Start</button>
                        </div>
                     </div>
                     <div class="player-list">
                        <label class="form-label">Andere Spieler</label>
                        <div class="station-player-table">
                           <table class="table table-dark table-sm mb-0 station-player-table-content">
                              <tbody id="stationPlayersTableBody">
                                 <tr>
                                    <td colspan="2" class="text-muted">Keine anderen Spieler verbunden</td>
                                 </tr>
                              </tbody>
                           </table>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </body>
</html>
