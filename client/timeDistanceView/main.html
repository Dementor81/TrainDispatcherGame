<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeit-Weg-Diagramm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" crossorigin="anonymous" />
    <style>
      html, body { height: 100%; margin: 0; }
      #app { display: flex; flex-direction: column; height: 100%; }
      #canvas-container { flex: 1 1 auto; position: relative; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app">
      <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h1">Zeit-Weg-Diagramm</span>
          <div class="d-flex align-items-center gap-3 ms-auto">
            <div id="scenario-title" class="text-white small"></div>
            <div class="text-white-50 small">Route:</div>
            <select id="route-select" class="form-select form-select-sm bg-dark text-light" style="width: 280px;"></select>
            <button id="direction-filter-btn" class="btn btn-sm btn-outline-light" title="Züge nach Richtung filtern">
              <i class="bi bi-arrow-left-right"></i>
            </button>
          </div>
        </div>
      </nav>
      <div id="canvas-container"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
